name: Santomen | Pages Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic validation
        run: |
          node --check config.js
          node --check i18n.js
          node --check app.js
          node --check admin.js
          node --test tests/static.test.cjs
      - name: Prepare public preview only
        run: |
          mkdir -p _site/assets
          cp index.html admin.html privacidade.html termos.html style.css admin.css app.js admin.js config.js i18n.js _site/
          cp assets/logo-santomen.webp _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Santomen preview
        id: deployment
        uses: actions/deploy-pages@v4
